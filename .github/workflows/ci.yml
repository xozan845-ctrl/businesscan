name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test --all-targets

      - name: Documentación
        run: cargo doc --no-deps

  termux-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compilar Android ARM64
        run: cargo ndk -t arm64-v8a -p 24 build --release

      - name: Verificar binario
        run: file target/aarch64-linux-android/release/nicascan
