[package]
name = "nicascan"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Directorio extensible de negocios de Nicaragua desde múltiples fuentes, con SQLite portable"
license = "MIT"
repository = "https://github.com/xozan845-ctrl/nicascan"
homepage = "https://github.com/xozan845-ctrl/nicascan"
keywords = ["nicaragua", "business", "directory", "cli", "scraper"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "nicascan"
path = "src/main.rs"

[lib]
name = "nicascan"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
comfy-table = "7.1"
csv = "1.3"
directories = "5.0"
env_logger = "0.11"
encoding_rs = "0.8"
indicatif = "0.17"
log = "0.4"
owo-colors = "4.1"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
ulid = "1.1"
unicode-normalization = "0.1"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
